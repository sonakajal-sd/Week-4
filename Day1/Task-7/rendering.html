<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Render only visible Items</title>
    <link rel="stylesheet" href="./css/rendering.css">
</head>
<body>

    <h1>Virtual Scroll - 10,000 Items</h1>

    <div id="list-container">

        <!--
            This represents the full
            10,000 item height
        -->
        <div id="spacer">

            <!--
                Only visible items
                will be rendered here
            -->
            <div id="visible-items"></div>

        </div>

    </div>



    <script src="./js/rendering.js"></script>
</body>
</html>
