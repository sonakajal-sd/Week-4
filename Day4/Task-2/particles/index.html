<!DOCTYPE html>
<html>
<head>
    <title>Particle Orbit Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top">
        <h1>Particle Orbit Animation</h1>
        <p>Sun and Planets</p>
    </div>

    <div class="controls">
        <h3>Controls</h3>

        <button id="resumeButton">▶ Resume</button>
        <button id="pauseButton">Ⅱ Pause</button>
    </div>

    <div class="stats">
        <div>Particles: <span id="particleCount">200</span></div>
        <div>FPS: <span id="fps">60</span></div>
    </div>

    <canvas id="canvas" width="900" height="700"></canvas>

    <div class="bottom-buttons">
        <button id="resumeBottom">▶ Resume</button>
        <button id="pauseBottom">Ⅱ Pause</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
