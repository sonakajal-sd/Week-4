<!DOCTYPE html>
<html>
<head>
    <title>requestAnimationFrame Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>requestAnimationFrame Demo</h1>

    <section class="counter-section">
        <h2>Animated Counter</h2>

        <div id="counter">0</div>

        <button id="startCounter">Start Counter</button>
    </section>

    <section class="particle-section">
        <h2>Particle System — 200 Particles</h2>

        <canvas id="canvas" width="800" height="500"></canvas>

        <br>

        <button id="pauseButton">Pause</button>
        <button id="resumeButton">Resume</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
